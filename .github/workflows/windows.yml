name: Eseguibile Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verifica supporto Bluetooth RFCOMM
        run: python -c "import socket; print(socket.AF_BLUETOOTH, socket.BTPROTO_RFCOMM)"
      - run: pip install pyinstaller
      - name: Compila
        run: >
          pyinstaller --onefile --noconsole --name HaylouS30
          --icon assets/icon.ico --add-data "static;static" server.py
      - uses: actions/upload-artifact@v4
        with:
          name: HaylouS30-windows
          path: dist/HaylouS30.exe
      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HaylouS30.exe
