name: Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Bluetooth RFCOMM support
        run: python -c "import socket; print(socket.AF_BLUETOOTH, socket.BTPROTO_RFCOMM)"
      - run: pip install pyinstaller
      - name: Build
        run: >
          pyinstaller --onefile --noconsole --name HaylouS30
          --icon assets/icon.ico --add-data "static;static" server.py
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $p = Start-Process dist/HaylouS30.exe -PassThru
          Start-Sleep 5
          foreach ($f in "", "app.js", "haylou.jpg", "api/ping") {
            $r = Invoke-WebRequest "http://127.0.0.1:8730/$f" -UseBasicParsing
            Write-Host "/$f $($r.StatusCode) $($r.Headers['Content-Type'])"
          }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: HaylouS30-windows
          path: dist/HaylouS30.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HaylouS30.exe
